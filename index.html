<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6B66">
<title>R&B Medical Laboratory – ระบบพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Playpen+Sans+Thai:wght@100..800&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>

<style>
:root{
  --primary:#0FA39A; --primary-600:#0B8A82; --primary-700:#0A6B66;
  --primary-50:#E7F6F4; --primary-100:#CDEDE9;
  --accent:#3B9EE0; --rose:#E35D5D; --rose-50:#FDEEEE; --green:#16A34A;
  --text:#16302F; --text-2:#4A6260; --muted:#8AA09E; --line:#E4EFEE;
  --bg:#F2F7F7; --card:#FFFFFF;
  --radius-lg:10px; --radius:16px;
  --shadow-sm:0 1px 2px rgba(16,60,58,.06),0 4px 14px rgba(16,60,58,.05);
  --shadow:0 14px 32px -12px rgba(10,107,102,.45);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Playpen Sans Thai',system-ui,sans-serif;background:#DCEAE9;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.ic{flex-shrink:0;display:block}

/* ---------- App shell ---------- */
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.08)}
main{padding:8px 16px calc(24px + var(--safe-b))}
.page{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 6px 14px -4px rgba(15,163,154,.3);border:1px solid var(--line)}
.brand-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.brand-text strong{display:block;font-size:17px;font-weight:700;line-height:1.1;letter-spacing:-.2px;color:var(--text)}
.brand-text strong em{font-style:normal;color:var(--primary)}
.brand-text span{display:block;margin-top:-3px;font-size:11px;line-height:1.15;color:var(--muted);letter-spacing:.3px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.avatar-btn{position:relative;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--primary),var(--accent))}
.online-dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#22C55E;border:2px solid #fff}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary-700);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}

.avatar{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#CFF1EC,#E3F1FB);color:var(--primary-700);font-weight:600}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-sm{width:36px;height:36px;font-size:13px;border:2px solid #fff}
.avatar-md{width:44px;height:44px;font-size:15px}
.avatar-lg{width:72px;height:72px;font-size:24px;border:3px solid #fff}

/* ---------- Dropdown menu ---------- */
.menu-overlay{position:fixed;inset:0;z-index:60;background:rgba(10,40,38,.25);opacity:0;pointer-events:none;transition:.25s}
.menu-panel{position:fixed;top:72px;right:max(12px,calc(50% - 228px));z-index:70;width:270px;padding:10px;background:#fff;border-radius:20px;box-shadow:0 20px 50px -12px rgba(10,60,58,.35);transform-origin:top right;transform:scale(.92) translateY(-8px);opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,.8,.2,1)}
body.menu-open .menu-overlay{opacity:1;pointer-events:auto}
body.menu-open .menu-panel{opacity:1;transform:none;pointer-events:auto}
.menu-user{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:6px;border-radius:14px;background:linear-gradient(135deg,var(--primary-50),#EAF4FB)}
.menu-user b{display:block;font-size:14px}
.menu-user small{font-size:12px;color:var(--text-2)}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;font-size:15px;color:var(--text-2);transition:background .15s}
.menu-item:hover{background:#F5FAFA}
.menu-item.active{background:var(--primary);color:#fff;font-weight:600}
.menu-item.danger{color:var(--rose)}
.menu-divider{height:1px;background:var(--line);margin:6px 4px}

/* ---------- Sticky employee card ---------- */
.hero-wrap{position:sticky;top:64px;z-index:40;padding:12px 16px 6px;background:var(--bg)}
.hero-wrap::after{content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;pointer-events:none;
  background:linear-gradient(var(--bg),rgba(242,247,247,0))}

.hero{position:relative;overflow:hidden;color:#fff;padding:14px 16px;border-radius:var(--radius-lg);
  background:linear-gradient(140deg,#0A6B66 0%,#0FA39A 55%,#46C7B8 100%);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:180px;height:180px;top:-80px;right:-50px}
.hero::after{width:120px;height:120px;bottom:-60px;left:-30px}
.hero > *{position:relative;z-index:1}

.hero-avatar-wrap{position:relative;flex-shrink:0}
.hero-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:#fff;color:var(--rose);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.hero-info{min-width:0;flex:1}
.hero-info h1{font-size:18px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-en{font-size:12px;opacity:.85;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-tenure{display:inline-block;font-size:12.5px;font-weight:500;color:#E7F6F4}

/* ---------- Profile, Finance & Login ---------- */
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:4px}
.card-title::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--primary)}
.info-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.info-row:last-child{border-bottom:0;padding-bottom:0}
.info-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary-600)}
.info-row small{display:block;font-size:12px;color:var(--muted)}
.info-row b{font-size:15px;font-weight:600}
.info-row .sub{display:block;font-size:12px;color:var(--primary-600);font-weight:500}

.actions{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;font-size:15.5px;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-700));box-shadow:0 10px 20px -8px rgba(15,163,154,.7)}
.btn-outline{background:#fff;color:var(--primary-700);border:1.5px solid var(--primary-100)}

.login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:url('img/screen.png') no-repeat center center;background-size:cover;position:relative}
.login-card{width:100%;max-width:380px;background:#fff;padding:28px 24px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);text-align:center;transform:translateY(-8px)}
.login-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(15,163,154,.3);border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.login-logo img{width:100%;height:100%;object-fit:contain;padding:8px}
.login-card h2{font-size:20px;color:var(--primary-700);margin-bottom:4px}
.login-card p{font-size:12.5px;color:var(--muted);margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-2)}
.form-control{width:100%;height:50px;padding:0 16px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;color:var(--text);outline:none;transition:border-color .2s;background:#FAFCFC}
.form-control:focus{border-color:var(--primary);background:#fff}
.login-btn{width:100%;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-700));color:#fff;font-size:16px;font-weight:600;box-shadow:0 10px 20px -8px rgba(15,163,154,.7);margin-top:8px;transition:transform .15s}
.login-btn:active{transform:scale(.98)}

.finance-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.fin-card{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-sm);text-align:center}
.fin-card small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fin-card b{font-size:18px;color:var(--primary-700);font-weight:700}

.pay-list{display:grid;gap:10px}
.pay-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-radius:16px;box-shadow:var(--shadow-sm)}
.pay-left{display:flex;align-items:center;font-size:15px;font-weight:600}
.pay-right{display:flex;align-items:center;gap:12px}
.pay-amount{font-size:15px;font-weight:700;color:var(--primary-700)}
.btn-detail{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary-700);transition:background .15s}
.btn-detail:active{background:var(--primary-100)}

/* Certificate & ID Card styles */
.cert{font-family:'Sarabun';position:relative;overflow:hidden;padding:24px 20px;background:#fff;border-radius:20px;box-shadow:var(--shadow-sm);font-size:13.5px;line-height:1.85}
.cert::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.cert-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.cert-head .brand-logo{width:38px;height:38px;background:#fff;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.cert-head .brand-logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.cert-head b{display:block;font-size:14px;line-height:1.35}
.cert-head small{display:block;font-size:11px;line-height:1.4;color:var(--muted)}

.id-card{font-family:'Sarabun';position:relative;width:100%;max-width:340px;margin:0 auto;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 24px 50px -16px rgba(10,107,102,.45)}
.id-top{position:relative;overflow:hidden;padding:18px 18px 60px;color:#fff;background:linear-gradient(140deg,#0A6B66,#0FA39A 60%,#46C7B8)}
.id-brand{display:flex;align-items:center;gap:10px;position:relative}
.id-brand .brand-logo{width:34px;height:34px;background:#fff;border-radius:8px;box-shadow:none;display:grid;place-items:center;overflow:hidden}
.id-brand .brand-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.id-brand b{display:block;font-size:15px;line-height:1.1}
.id-brand small{font-size:10px;letter-spacing:1px;opacity:.85}
.id-type{position:absolute;right:16px;top:22px;padding:4px 10px;border:1px solid rgba(255,255,255,.45);border-radius:999px;font-size:9.5px;letter-spacing:2px}
.id-photo{position:relative;z-index:1;width:100px;height:100px;margin:-52px auto 0;overflow:hidden;border:4px solid #fff;border-radius:26px;box-shadow:0 10px 20px -8px rgba(0,0,0,.25)}
.id-photo img{width:100%;height:100%;object-fit:cover}
.id-body{padding:10px 18px 0;text-align:center}
.id-body h4{font-size:19px;line-height:1.3}
.id-body .en{font-size:12px;color:var(--muted)}
.id-role{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--primary-50);color:var(--primary-700)}
.id-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 18px 0;padding:12px 14px;border-radius:14px;font-size:12.5px;background:#F5FAFA}
.id-meta small{display:block;font-size:10.5px;color:var(--muted)}
.id-meta b{font-weight:600;line-height:1.35}
.id-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 18px}
.barcode{display:flex;align-items:stretch;height:38px}
.barcode span{display:block;background:#123B39}
.barcode-text{margin-top:4px;font-size:10px;letter-spacing:2px;color:var(--text-2)}
.qr{width:66px;height:66px;padding:5px;border:1px solid var(--line);border-radius:10px}
.id-strip{height:6px;background:linear-gradient(90deg,var(--primary),var(--accent))}

/* e-Pay Slip Layout */
.slip-container{font-family:'Sarabun', sans-serif;background:#fff;border-radius:var(--radius-lg);padding:24px 20px;box-shadow:var(--shadow-sm);font-size:13px;color:#222;position:relative;margin-bottom:14px}
.slip-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #ddd;padding-bottom:12px;margin-bottom:14px}
.slip-brand{display:flex;align-items:center;gap:8px}
.slip-brand img{width:36px;height:36px;object-fit:contain}
.slip-brand-text b{display:block;font-size:13px;color:#111}
.slip-brand-text span{font-size:11px;color:#666}
.slip-doc-no{font-size:11px;color:#666;text-align:right}

.slip-title{text-align:center;margin-bottom:16px}
.slip-title h2{font-size:22px;font-weight:700;color:#0A6B66;letter-spacing:.5px}
.slip-title p{font-size:11px;color:#666}

.slip-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:16px;font-size:12.5px}
.slip-info-row{display:flex;justify-content:space-between;padding:3px 0}
.slip-info-row span:first-child{color:#666}
.slip-info-row span:last-child{font-weight:600;color:#111;text-align:right}

.slip-section-title{font-size:13.5px;font-weight:700;color:#0A6B66;margin:12px 0 6px;border-bottom:1px solid #eee;padding-bottom:4px}
.slip-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.slip-row span:last-child{font-weight:600}

.slip-total-box{border-top:1px solid #111;border-bottom:1px solid #111;padding:6px 0;margin:10px 0;display:flex;justify-content:space-between;font-weight:700;font-size:13.5px}
.slip-net-box{border-bottom:3px double #111;padding:6px 0 8px;margin-bottom:14px;display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:#0A6B66}

.slip-footer{margin-top:20px;padding-top:10px;border-top:1px solid #ddd;font-size:10.5px;color:#666;display:flex;justify-content:space-between;align-items:flex-end}

.slip-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.action-btn{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:16px;font-size:14.5px;font-weight:600;transition:transform .15s}
.action-btn:active{transform:scale(.98)}
.action-btn.back{background:#fff;color:var(--text-2);border:1.5px solid var(--line)}
.action-btn.print{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-700));box-shadow:0 10px 20px -8px rgba(15,163,154,.7)}

/* ---------- Bottom sheet ---------- */
.sheet-overlay{position:fixed;inset:0;z-index:90;background:rgba(8,35,34,.45);opacity:0;pointer-events:none;transition:.3s}
.sheet{position:fixed;left:50%;bottom:0;z-index:100;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:10px 16px calc(20px + var(--safe-b));background:var(--bg);border-radius:28px 28px 0 0;transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
body.sheet-open .sheet-overlay{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:translate(-50%,0)}
body.sheet-open{overflow:hidden}
.sheet-handle{width:44px;height:5px;margin:0 auto 12px;border-radius:5px;background:#C9D8D7}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-top h3{font-size:17px}
.close-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--shadow-sm)}

.toast{position:fixed;left:50%;bottom:calc(30px + var(--safe-b));z-index:200;display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:14px;white-space:nowrap;font-size:14px;color:#fff;background:#123B39;opacity:0;pointer-events:none;transform:translate(-50%,20px);transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body>
<div class="app">
  <header class="topbar" id="topbar" style="display:none">
    <a class="brand" href="#profile" aria-label="หน้าแรก">
      <div class="brand-logo"><img src="img/logo.png" alt="Logo"></div>
      <div class="brand-text">
        <strong>R&amp;B</strong>
        <span>Medical Laboratory</span>
      </div>
    </a>
    <div class="topbar-actions">
      <a href="#profile" class="avatar-btn" aria-label="โปรไฟล์">
        <span id="topAvatar"></span><i class="online-dot"></i>
      </a>
      <button class="icon-btn" id="menuBtn" aria-label="เมนู"></button>
    </div>
  </header>

  <div class="hero-wrap" id="heroWrap" style="display:none"></div>
  <main id="view"></main>
</div>

<!-- Dropdown menu -->
<div class="menu-overlay" id="menuOverlay"></div>
<nav class="menu-panel" id="menuPanel">
  <div class="menu-user" id="menuUser"></div>
  <a href="#profile" class="menu-item" data-page="profile"><span data-icon="user"></span>ข้อมูลพนักงาน</a>
  <a href="#finance" class="menu-item" data-page="finance"><span data-icon="wallet"></span>การเงิน</a>
  <div class="menu-divider"></div>
  <button class="menu-item danger" data-action="logout"><span data-icon="logout"></span>ออกจากระบบ</button>
</nav>

<!-- Bottom sheet -->
<div class="sheet-overlay" data-action="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const company = {
  name: 'R&B Medical Laboratory.co.,Ltd.',
  nameTh: 'อาร์แอนด์บี เมดิคอล แลบอราทอรี่ จำกัด',
  address: '125/39 หมู่ 3 ต.บึงยี่โถ อ.ธัญบุรี จ.ปทุมธานี 12130'
};

const employee = {
  prefix: 'นาย', firstName: 'ธนกร', lastName: 'ลาอองสำลี',
  nameEn: 'Thanakorn Laongsamlee',
  id: '664872',
  department: 'ตรวจสุขภาพเคลื่อนที่ (Mobile Checkup)',
  position: 'เจ้าหน้าที่สารสนเทศ (IT)',
  startDate: '2022-12-01',
  type: 'พนักงานประจำ',
  leaveLeft: 8,
  photo: 'img/profile.png'
};

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3-LIDufRqjaBFd9ENXZS0tfUpzCrdlFH5yl1PpQqFhEH3Maq5S0eX7lTbgplNbLwO/exec';

const ICONS = {
  menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  x:'<path d="M18 6L6 18M6 6l12 12"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16c.6-1.4 1.8-2 3.2-2s2.6.6 3.2 2M14 10h4M14 13.5h3"/>',

const icon = (n, s = 20, w = 2) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

const fmt = n => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const thaiDate = d => new Date(d).toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });

function tenure() {
  const s = new Date(employee.startDate), n = new Date();
  let m = (n.getFullYear() - s.getFullYear()) * 12 + (n.getMonth() - s.getMonth());
  if (n.getDate() < s.getDate()) m--;
  return { y: Math.floor(m / 12), m: m % 12 };
}

function avatar(size) {
  const inner = employee.photo ? `<img src="${employee.photo}" alt="${name()}">` : employee.firstName[0] + employee.lastName[0];
  return `<span class="avatar avatar-${size}">${inner}</span>`;
}

function rng(str) {
  let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return () => (h = (h * 1664525 + 1013904223) >>> 0) / 4294967296;
}
function barcode(text) {
  const r = rng(text); let out = '';
  for (let i = 0; i < 48; i++) {
    const w = 1 + Math.floor(r() * 3);
    out += `<span style="width:${w}px;${i % 2 ? 'background:transparent' : ''}"></span>`;
  }
  return out;
}
function qr(text) {
  const r = rng(text + 'qr'), n = 21;
  const inFinder = (x, y) => (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (!inFinder(x, y) && r() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 21 21" fill="#123B39" shape-rendering="crispEdges">${cells}${f(0,0)}${f(14,0)}${f(0,14)}</svg>`;
}

async function handleLogin(e) {
  e.preventDefault();
  const userId = document.getElementById('userInput').value.trim();
  const password = document.getElementById('passInput').value.trim();

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', userId: userId, password: password })
    });
    const json = await res.json();

    if (json.status === 'success') {
      location.hash = 'profile';
    } else {
      alert('รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง');
      document.getElementById('userInput').value = '';
      document.getElementById('passInput').value = '';
    }
  } catch (err) {
    console.error(err);
    alert('เกิดข้อผิดพลาดในการเชื่อมต่อระบบ Login');
    document.getElementById('userInput').value = '';
    document.getElementById('passInput').value = '';
  }
}

async function fetchFinanceData() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const json = await res.json();
    if (json.status === 'success') {
      const rows = json.salaryRows;
      rows.sort((a, b) => b[0] - a[0]);

      let totalCount = 0;
      let grandTotal = 0;
      let listHTML = '';

      rows.forEach((r) => {
        const colA = r[0];
        const colB = r[1] || '';
        const colC = r[2] || '';
        const colD = Number(r[3] || 0);

        if (colA !== '') {
          totalCount++;
          grandTotal += colD;
          
          const textBC = `${colB}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${colC}`;
          const amountStr = fmt(colD);

          listHTML += `
            <div class="pay-item">
              <div class="pay-left">${textBC}</div>
              <div class="pay-right">
                <span class="pay-amount">${amountStr}</span>
                <button class="btn-detail" data-action="view-detail" data-id="${colA}" aria-label="ดูรายละเอียด">${icon('chevronRight', 18, 2.5)}</button>
              </div>
            </div>`;
        }
      });

      document.getElementById('finCount').innerText = totalCount + ' งวด';
      document.getElementById('finTotal').innerText = '฿ ' + fmt(grandTotal);
      document.getElementById('finList').innerHTML = listHTML || '<div style="text-align:center;padding:20px;color:var(--muted)">ไม่พบข้อมูล</div>';
      
      window.salaryRows = rows;
      window.incomeRows = json.incomeRows || [];
      window.payRows = json.payRows || [];
    }
  } catch (err) {
    console.error(err);
  }
}

function populateDetail(id) {
  const salary = (window.salaryRows || []).find(r => String(r[0]) === String(id));
  if (!salary) return;

  document.getElementById('slipPeriod').innerText = salary[4] || `${salary[1]} ${salary[2]}`;
  document.getElementById('slipTotalCount').innerText = (window.salaryRows || []).length;
  
  const now = new Date();
  document.getElementById('slipPayDate').innerText = `1/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()+543}`;
  document.getElementById('slipYearlyTotal').innerText = fmt(window.salaryRows.reduce((acc, r) => acc + Number(r[3]||0), 0));

  const incomes = (window.incomeRows || []).filter(r => String(r[0]) === String(id));
  let incHTML = '';
  let sumIncome = 0;
  incomes.forEach(r => {
    const title = r[1] || '';
    const val = Number(r[2] || 0);
    sumIncome += val;
    incHTML += `<div class="slip-row"><span>${title}</span><span>${fmt(val)}</span></div>`;
  });
  document.getElementById('slipIncomeRows').innerHTML = incHTML || '<div style="color:#666;font-size:12px">ไม่มีรายการรายรับ</div>';

  const pays = (window.payRows || []).filter(r => String(r[0]) === String(id));
  let payHTML = '';
  let sumPay = 0;
  pays.forEach(r => {
    const title = r[1] || '';
    const val = Number(r[2] || 0);
    sumPay += val;
    payHTML += `<div class="slip-row"><span>${title}</span><span>${fmt(val)}</span></div>`;
  });
  document.getElementById('slipPayRows').innerHTML = payHTML || '<div style="color:#666;font-size:12px">ไม่มีรายการหัก</div>';

  document.getElementById('slipTotalIncomeTxt').innerText = fmt(sumIncome);
  document.getElementById('slipTotalPayTxt').innerText = fmt(sumPay);
  document.getElementById('slipNetTxt').innerText = fmt(sumIncome - sumPay);

  const printTimeStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()+543} ,${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('slipPrintTime').innerText = `Print Time: ${printTimeStr}`;
}

const view = document.getElementById('view');
const topbar = document.getElementById('topbar');
const heroWrap = document.getElementById('heroWrap');

function router() {
  const hash = location.hash.slice(1) || 'login';

  if (hash === 'login') {
    topbar.style.display = 'none';
    heroWrap.style.display = 'none';
    view.innerHTML = renderLogin();
  } else {
    topbar.style.display = 'flex';
    heroWrap.style.display = 'block';
    heroWrap.innerHTML = renderHero();

    document.querySelectorAll('.menu-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('href') === '#' + hash);
    });

    if (hash === 'finance') {
      view.innerHTML = renderFinance();
      fetchFinanceData();
    } else if (hash.startsWith('detail-')) {
      const id = hash.split('-')[1];
      view.innerHTML = renderDetail();
      if (!window.salaryRows) {
        fetchFinanceData().then(() => populateDetail(id));
      } else {
        populateDetail(id);
      }
    } else {
      view.innerHTML = renderProfile();
    }
  }
  setMenu(false); closeSheet(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'cert') openSheet(certHTML());
  else if (action === 'card') openSheet(cardHTML()); /* เพิ่มการดักจับปุ่มบัตรพนักงาน */
  else if (action === 'close-sheet') closeSheet();
  else if (action === 'view-detail') {
    loadDetailPage(btn.dataset.id);
  }
  else if (action === 'go-back') {
    location.hash = 'finance';
  }
  else if (action === 'print-slip') {
    window.print();
  }
  else if (action === 'logout') { 
    setMenu(false); 
    location.hash = 'login';
    toast('ออกจากระบบเรียบร้อย'); 
  }
});

router();
